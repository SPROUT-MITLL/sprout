<div class="step-viewer" data-step-url="{{ include.url }}" style="margin: 0.5rem 0 1.5rem;">
  <div class="step-viewer-controls" style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
    <button type="button" class="step-viewer-load btn">View {{ include.name }} in 3D</button>
    <span class="step-viewer-status" hidden style="color: #5c5962; font-size: 0.85rem;"></span>
  </div>
  <div class="step-viewer-canvas" hidden style="width: 100%; height: 400px; border: 1px solid #e6e1e8; border-radius: 6px; overflow: hidden;"></div>
</div>
