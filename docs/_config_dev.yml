# Local-only override: renders images from files on disk (via the
# docs/SPROUT_Design symlink) instead of GitHub's raw URLs, so images show up
# even before this content has been pushed. Not used in production builds.
#
# Usage:
#   ln -s ../SPROUT_Design SPROUT_Design   # one-time, from inside docs/
#   bundle exec jekyll serve --config _config.yml,_config_dev.yml --livereload

github_raw: /sprout

# _config.yml's `exclude` is fully replaced (not merged) by this list, so it
# repeats those entries plus the heavy folders we don't need to serve locally.
# Note: CAD and Electronics are NOT excluded here (unlike production docs)
# because the 3D STEP-file previews need to fetch real .step files from disk
# locally; an `include:` override doesn't work because Jekyll prunes excluded
# directories before checking include patterns against their contents.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - SPROUT_Design/Documentation/Photos
  - SPROUT_Design/Documentation/Vine Photos
  - SPROUT_Design/Code/sprout_ros
